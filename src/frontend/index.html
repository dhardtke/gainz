<!doctype html>
<!--suppress HtmlUnknownTarget, HtmlUnknownTag -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="gainz — a simple log for weight-lifting progress." />
    <title>gainz — lifting log</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>&#127947;</text></svg>"
    />
    <script>
      // Applies a stored theme before the first paint, so choosing light on a
      // dark system does not flash dark on every load. src/frontend/ui/theme.ts owns the
      // preference from then on; the storage key is duplicated here on purpose,
      // because this must run before any module has loaded.
      try {
        const storedTheme = localStorage.getItem('gainz:theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', storedTheme);
        }
      } catch (error) {
        /* Storage unavailable — fall through to following the system. */
      }
    </script>
    <!--
      Oat styles the document itself; the same file is also adopted into every
      component's shadow root by src/frontend/ui/styles.ts, where its tokens (declared
      on :root) and its body typography arrive by inheritance. oat.js is deferred, so it
      runs before the modules below that use ot-dropdown and window.ot.
    -->
    <link rel="stylesheet" href="/vendor/oat.css" />
    <link rel="stylesheet" href="/ui/app.css" />
    <script src="/vendor/oat.js" defer></script>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <gz-app></gz-app>
    <noscript>
      <main class="container">
        <p>gainz is a client-rendered app and needs JavaScript enabled.</p>
      </main>
    </noscript>
  </body>
</html>

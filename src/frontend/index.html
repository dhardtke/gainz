<!doctype html>
<!--suppress HtmlUnknownTarget, HtmlUnknownTag -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="gainz — a simple log for weight-lifting progress." />
    <title>gainz — lifting log</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fff" />
    <script>
      // Applies a stored theme before the first paint, so choosing light on a
      // dark system does not flash dark on every load. src/frontend/ui/theme.ts owns the
      // preference from then on; the storage key is duplicated here on purpose,
      // because this must run before any module has loaded.
      {
        let storedTheme = null;
        try {
          storedTheme = localStorage.getItem('gainz:theme');
          if (storedTheme === 'light' || storedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', storedTheme);
          }
        } catch (error) {
          /* Storage unavailable — fall through to following the system. */
        }
        // Colors the status bar and title bar like the header. theme.ts and --card in
        // ui/app.css hold the same two colors — keep them in sync.
        try {
          const dark = storedTheme === 'dark' || (storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#202024' : '#fff');
        } catch (error) {
          /* No matchMedia — keep the light default. */
        }
      }
    </script>
    <!--
      Oat and shared.css style the document itself, where the views and the login form
      live; the same files are also adopted into every component's shadow root by
      src/frontend/ui/styles.ts, where Oat's tokens (declared on :root) and its body
      typography arrive by inheritance. oat.js is deferred, so it runs before the
      modules below that use ot-dropdown and window.ot.
    -->
    <link rel="stylesheet" href="/vendor/oat.css" />
    <link rel="stylesheet" href="/ui/shared.css" />
    <link rel="stylesheet" href="/ui/app.css" />
    <script src="/vendor/oat.js" defer></script>
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <gz-app></gz-app>
    <noscript>
      <main class="container">
        <p>gainz is a client-rendered app and needs JavaScript enabled.</p>
      </main>
    </noscript>
  </body>
</html>
